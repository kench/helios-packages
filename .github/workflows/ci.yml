name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The title becomes the commit message on main for squash merges, the only merge method
      # allowed here. The PR's own commits are checked too, as in the other Helios repositories.
      - name: Check PR title and commit subjects
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          echo "PR title:"
          printf '%s\n' "$PR_TITLE" | sh .github/scripts/check-conventional-commit.sh
          echo
          echo "Commits:"
          git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA" \
            | sh .github/scripts/check-conventional-commit.sh

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every shell script in the repository: the build and packaging scripts to come, and the
      # CI helpers.
      - name: Shellcheck
        run: |
          set -eu
          scripts=$(git ls-files '*.sh')
          if [ -z "$scripts" ]; then
            echo "no shell scripts"
            exit 0
          fi
          echo "$scripts"
          # -x follows sourced files, such as each package's package.env.
          shellcheck -x --severity=style $scripts

  # Packages whose folder changed in the PR, or all of them when the shared build changed.
  changed:
    name: Changed packages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.changed.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List them
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          all=$(for f in */package.env; do dirname "$f"; done)
          if printf '%s\n' "$files" | grep -qE '^\.github/(scripts/build-package\.sh|workflows/build-package\.yml)$'; then
            packages=$all
          else
            packages=$(for p in $all; do printf '%s\n' "$files" | grep -q "^$p/" && echo "$p"; done || true)
          fi
          json=$(printf '%s\n' $packages | python3 -c 'import json,sys;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "packages: $json"
          echo "packages=$json" >>"$GITHUB_OUTPUT"

  build:
    name: Build
    needs: changed
    if: needs.changed.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changed.outputs.packages) }}
    uses: ./.github/workflows/build-package.yml
    with:
      package: ${{ matrix.package }}
